components:
  schemas:
    Vote:
      type: object
      properties:
        owner:
          type: string
          description: Reference to User ID
        pseudonym:
          type: string
        reason:
          type: string

    Message:
      type: object
      required:
        - body
        - conversation
        - fromAgent
        - pause
        - visible
        - pseudonym
        - pseudonymId
        - upVotes
        - downVotes
      properties:
        id:
          type: string
        owner:
          type: string
          description: Reference to User ID
        body:
          oneOf:
            - type: string
            - type: object
              additionalProperties: true
        bodyType:
          type: string
        source:
          type: string
        channels:
          type: array
          items:
            type: string
        conversation:
          type: string
          description: Reference to Conversation ID
        fromAgent:
          type: boolean
        pause:
          type: boolean
        visible:
          type: boolean
        count:
          type: integer
        pseudonym:
          type: string
        pseudonymId:
          type: string
        ownerIsAdmin:
          type: boolean
          description: >-
            Whether the author is an admin right now, not when they posted. Only present in
            conversations that use real names, so an anonymous poster is never revealed as an admin.
        active:
          type: boolean
        isDeleted:
          type: boolean
        upVotes:
          type: array
          items:
            $ref: '#/components/schemas/Vote'
        downVotes:
          type: array
          items:
            $ref: '#/components/schemas/Vote'
        parentMessage:
          type: string
          description: Reference to parent Message ID
        answersPrompt:
          type: string
          description: Reference to the Message ID that this message answers (when responding to a prompt)
        prompt:
          $ref: '#/components/schemas/MessagePrompt'
        createdAt:
          type: string
          format: date-time
        replyCount:
          type: integer

    MessagePrompt:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - multipleChoice
            - singleChoice
            - text
            - number
            - date
            - custom
        options:
          type: array
          items:
            $ref: '#/components/schemas/PromptOption'
        placeholder:
          type: string
        validation:
          type: object
          properties:
            required:
              type: boolean
            min:
              type: number
            max:
              type: number
            pattern:
              type: string

    PromptOption:
      type: object
      required:
        - value
        - label
      properties:
        value:
          type: string
        label:
          type: string
        description:
          type: string

    Pseudonym:
      type: object
      required:
        - token
        - pseudonym
        - active
        - isDeleted
        - conversations
      properties:
        id:
          type: string
        token:
          type: string
        pseudonym:
          type: string
        active:
          type: boolean
        isDeleted:
          type: boolean
        conversations:
          type: array
          items:
            type: string
          description: Array of Conversation IDs
        funFact:
          type: string
          description: LLM-generated fun fact about the pseudonym

    Profile:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        bio:
          type: string
        alternateName:
          type: string
          description: Optional nickname or abbreviation (e.g. "Jon" for "Jonathan Smith")

    BaseUser:
      type: object
      properties:
        id:
          type: string

    User:
      type: object
      required:
        - password
        - username
        - pseudonyms
      properties:
        id:
          type: string
        username:
          type: string
        email:
          type: string
        password:
          type: string
        role:
          type: string
        goodReputation:
          type: boolean
        dataExportOptOut:
          type: boolean
        pseudonyms:
          type: array
          items:
            $ref: '#/components/schemas/Pseudonym'

    Follower:
      type: object
      required:
        - user
        - conversation
        - topic
      properties:
        user:
          type: string
          description: Reference to User ID
        conversation:
          type: string
          description: Reference to Conversation ID
        topic:
          type: string
          description: Reference to Topic ID

    Topic:
      type: object
      required:
        - name
        - conversations
        - votingAllowed
        - owner
        - conversationCreationAllowed
        - private
        - archivable
        - followers
      properties:
        id:
          type: string
        slug:
          type: string
        name:
          type: string
        description:
          type: string
          description: Optional description of the topic
        defaultSortAverage:
          type: number
        followed:
          type: boolean
        conversations:
          type: array
          items:
            $ref: '#/components/schemas/Conversation'
        votingAllowed:
          type: boolean
        owner:
          oneOf:
            - type: string
              description: User ObjectId when not populated
            - $ref: '#/components/schemas/User'
        conversationCreationAllowed:
          type: boolean
        private:
          type: boolean
        passcode:
          type: integer
        archivable:
          type: boolean
        archived:
          type: boolean
        isDeleted:
          type: boolean
        isArchiveNotified:
          type: boolean
        archiveEmail:
          type: string
        followers:
          type: array
          items:
            $ref: '#/components/schemas/Follower'
        latestMessageCreatedAt:
          type: string
          format: date-time
        messageCount:
          type: integer
        conversationCount:
          type: integer

    Channel:
      type: object
      required:
        - name
        - passcode
        - direct
      properties:
        id:
          type: string
        name:
          type: string
        passcode:
          type: string
          nullable: true
        direct:
          type: boolean
        participants:
          type: array
          items:
            $ref: '#/components/schemas/BaseUser'

    AdapterChannelConfig:
      type: object
      required:
        - direction
      properties:
        direct:
          type: boolean
          description: 'Indicates if this is a direct message channel'
        agent:
          type: string
          description: 'Agent ID or name for direct message channel'
        name:
          type: string
          description: 'The channel name. Optional if this is a direct message channel.'
        direction:
          type: string
          enum: [incoming, outgoing, both]
        config:
          type: object
          additionalProperties: true

    Adapter:
      type: object
      required:
        - type
        - config
        - conversation
        - active
      properties:
        id:
          type: string
        type:
          type: string
        config:
          type: object
          additionalProperties: true
        conversation:
          type: string
          description: Reference to Conversation ID
        active:
          type: boolean
        audioChannels:
          type: array
          items:
            $ref: '#/components/schemas/AdapterChannelConfig'
        chatChannels:
          type: array
          items:
            $ref: '#/components/schemas/AdapterChannelConfig'
        dmChannels:
          type: array
          items:
            $ref: '#/components/schemas/AdapterChannelConfig'

    ConversationHistorySettings:
      type: object
      properties:
        count:
          type: integer
          description: Max number of messages to include in conversation history
        timeWindow:
          type: integer
          description: Time window in seconds for conversation history
        endTime:
          type: string
          format: date-time
        channels:
          type: array
          items:
            type: string
          description: Array of non-direct channel names to include in history
        directMessages:
          type: boolean
          description: Whether to include direct messages in history

    ConversationHistory:
      type: object
      required:
        - start
        - end
        - messages
      properties:
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
        messages:
          type: array
          items:
            $ref: '#/components/schemas/Message'

    PerMessageTrigger:
      type: object
      properties:
        minNewMessages:
          type: integer
          description: Minimum number of new messages before triggering
        directMessages:
          type: boolean
          description: Whether to trigger on direct messages
        channels:
          type: array
          items:
            type: string
          description: Array of channel names to monitor for messages
        conversationHistorySettings:
          $ref: '#/components/schemas/ConversationHistorySettings'

    PeriodicTrigger:
      type: object
      required:
        - timerPeriod
      properties:
        timerPeriod:
          type: integer
          description: Timer period in seconds to trigger agent message processing
        conversationHistorySettings:
          $ref: '#/components/schemas/ConversationHistorySettings'

    Triggers:
      type: object
      properties:
        perMessage:
          $ref: '#/components/schemas/PerMessageTrigger'
        periodic:
          $ref: '#/components/schemas/PeriodicTrigger'

    AgentEvaluation:
      type: object
      required:
        - action
      properties:
        action:
          type: integer
          description: 'Agent message action: 0=OK, 1=REJECT, 2=CONTRIBUTE'
          enum: [0, 1, 2]

    LlmPlatformOptions:
      type: object
      required:
        - useKeepAlive
      properties:
        useKeepAlive:
          type: boolean
        baseUrl:
          type: string

    Agent:
      type: object
      required:
        - name
        - description
        - pseudonyms
        - conversation
        - agentType
        - llmPlatform
        - llmModel
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        pseudonyms:
          type: array
          items:
            $ref: '#/components/schemas/Pseudonym'
        conversation:
          type: string
          description: Reference to Conversation ID
        instanceName:
          type: string
        agentType:
          type: string
        llmPlatform:
          type: string
          enum: [openai, ollama, perspective, bedrock, vllm, google]
        llmPlatformOptions:
          $ref: '#/components/schemas/LlmPlatformOptions'
        llmModel:
          type: string
        lastActiveMessageCount:
          type: number
        agentEvaluation:
          $ref: '#/components/schemas/AgentEvaluation'
        llmModelOptions:
          type: object
          additionalProperties: true
        llmTemplateVars:
          type: object
          additionalProperties:
            type: array
            items:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
        llmTemplates:
          type: object
          additionalProperties:
            type: string
        agentConfig:
          type: object
          additionalProperties: true
        ragCollectionName:
          type: string
        triggers:
          $ref: '#/components/schemas/Triggers'
        active:
          type: boolean
        conversationHistorySettings:
          $ref: '#/components/schemas/ConversationHistorySettings'

    ConfigProperty:
      type: object
      required:
        - name
        - required
        - type
      properties:
        name:
          type: string
        required:
          type: boolean
        type:
          type: string
          enum: [string, number, boolean, object, enum]
        label:
          type: string
        default:
          oneOf:
            - type: string
            - type: number
            - type: boolean
            - type: object
        description:
          type: string
        options:
          type: array
          items:
            type: object
        validationKeys:
          type: array
          items:
            type: string
        itemKey:
          type: string
        schema:
          type: array
          items:
            type: object

    PropertyRef:
      type: object
      required:
        - $ref
      properties:
        $ref:
          type: string
          description: Dot-notation path into resolved properties (including feature sub-objects)

    AgentProperty:
      oneOf:
        - $ref: '#/components/schemas/ConfigProperty'
        - $ref: '#/components/schemas/PropertyRef'

    ChannelConfig:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        passcode:
          type: string
          nullable: true
        direct:
          type: boolean

    AgentConfig:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        properties:
          type: array
          items:
            $ref: '#/components/schemas/AgentProperty'

    FeatureAgentConfig:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          description: Agent type name

    FeatureConfig:
      type: object
      required:
        - name
        - label
        - agents
        - default
        - category
        - userControlled
      properties:
        name:
          type: string
        label:
          type: string
        description:
          type: string
        agents:
          type: array
          description: Agents to create when the feature is enabled
          items:
            $ref: '#/components/schemas/FeatureAgentConfig'
        default:
          type: boolean
          description: Whether the feature is enabled by default
        properties:
          type: array
          description: User-configurable sub-properties shown in the form
          items:
            $ref: '#/components/schemas/ConfigProperty'
        category:
          type: string
          enum: [assistant, group-chat, transcript, resources]
          description: Platform area this feature belongs to
        slashCommand:
          type: string
          description: Slash command text without the leading slash (e.g. "mindmap"). Omit for passive features.
        prerequisite:
          type: string
          description: Optional setup instruction shown alongside the description (e.g. how to enable the feature).
        userControlled:
          type: boolean
          description: Whether the participant can control this feature (toggle or slash command). false = runs automatically.
        enabled:
          type: boolean
          description: Whether this feature is active for this conversation. Present in /features responses; absent means fall back to the type's default.

    PlatformConfig:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        label:
          type: string

    AdapterConfig:
      type: object
      required:
        - type
      properties:
        type:
          type: string
        config:
          type: object
          additionalProperties: true
        audioChannels:
          type: array
          items:
            $ref: '#/components/schemas/AdapterChannelConfig'
        chatChannels:
          type: array
          items:
            $ref: '#/components/schemas/AdapterChannelConfig'
        dmChannels:
          type: array
          items:
            $ref: '#/components/schemas/AdapterChannelConfig'

    ConversationType:
      type: object
      required:
        - name
        - description
        - platforms
        - properties
      properties:
        name:
          type: string
        label:
          type: string
        description:
          type: string
        platforms:
          type: array
          items:
            $ref: '#/components/schemas/PlatformConfig'
        properties:
          type: array
          items:
            $ref: '#/components/schemas/ConfigProperty'
        features:
          type: array
          items:
            $ref: '#/components/schemas/FeatureConfig'
        agents:
          type: array
          items:
            $ref: '#/components/schemas/AgentConfig'
        channels:
          type: array
          items:
            $ref: '#/components/schemas/ChannelConfig'
        enableDMs:
          type: array
          items:
            type: string
        adapters:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/AdapterConfig'

    Transcript:
      type: object
      required:
        - status
      properties:
        vectorStore:
          type: object
          properties:
            embeddingsPlatform:
              type: string
            embeddingsModelName:
              type: string
        status:
          type: string
          enum: [active, paused, stopped]
          default: stopped

    Conversation:
      type: object
      required:
        - messages
        - name
        - followers
        - agents
        - channels
        - adapters
        - enableDMs
        - experiments
        - owner
      properties:
        id:
          type: string
        messages:
          type: array
          items:
            $ref: '#/components/schemas/Message'
        slug:
          type: string
        name:
          type: string
        description:
          type: string
        conversationType:
          type: string
        platforms:
          type: array
          items:
            type: string
        followers:
          type: array
          items:
            $ref: '#/components/schemas/Follower'
        agents:
          type: array
          items:
            $ref: '#/components/schemas/Agent'
        presenters:
          type: array
          items:
            $ref: '#/components/schemas/Profile'
        moderators:
          type: array
          items:
            $ref: '#/components/schemas/Profile'
        channels:
          type: array
          items:
            $ref: '#/components/schemas/Channel'
        scheduledTime:
          type: string
          format: date-time
        scheduledEndTime:
          type: string
          format: date-time
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
        adapters:
          type: array
          items:
            $ref: '#/components/schemas/Adapter'
        enableDMs:
          type: array
          items:
            type: string
        experimental:
          type: boolean
        experiments:
          type: array
          items:
            $ref: '#/components/schemas/Experiment'
        active:
          type: boolean
        draft:
          type: boolean
          readOnly: true
          description: >
            Server-computed. True until the conversation has a valid Zoom link, name,
            topic, scheduledTime, and scheduledEndTime; cannot be set directly by clients.
        locked:
          type: boolean
        enableAgents:
          type: boolean
        owner:
          oneOf:
            - type: string
              description: User ObjectId when not populated
            - $ref: '#/components/schemas/User'
        topic:
          oneOf:
            - type: string
              description: Topic ObjectId when not populated
            - $ref: '#/components/schemas/Topic'
        followed:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        messageCount:
          type: number
        transcript:
          $ref: '#/components/schemas/Transcript'
        properties:
          type: object
          additionalProperties: true
        features:
          type: array
          items:
            type: object
            required:
              - name
            properties:
              name:
                type: string
              enabled:
                type: boolean
                description: Whether this feature is active for this conversation. Absent means fall back to the type's default.
              config:
                type: object
                additionalProperties: true
        resources:
          type: array
          items:
            $ref: '#/components/schemas/Resource'
        goals:
          type: array
          items:
            type: string
          description: Goal IDs active for this conversation (must match a defined goal file).
        conversationContext:
          type: object
          description: Optional context hints that shape how agents interpret the conversation.
          properties:
            conversationType:
              type: string
            purpose:
              type: string
            audience:
              type: object
              properties:
                expertiseLevel:
                  type: string
                  enum: [beginner, mixed, expert]
                assumedBackgroundKnowledge:
                  type: string
                  enum: [low, lowToMedium, medium, high]
                type:
                  type: array
                  items:
                    type: string
                description:
                  type: string
            contentSensitivity:
              type: object
              properties:
                level:
                  type: string
                  enum: [standard, elevated, high]
                domains:
                  type: array
                  items:
                    type: string
        behaviorPolicy:
          type: object
          description: Configures agent tone, verbosity, and channel-specific behavior.
          properties:
            globalPolicy:
              type: object
              properties:
                tone:
                  type: string
                  enum: [clearNeutral, warmSupportive, playful, professional]
                verbosity:
                  type: string
                  enum: [brief, medium, detailed]
                formality:
                  type: string
                  enum: [casual, semiFormal, formal]
                jargonLevel:
                  type: string
                  enum: [low, lowToMedium, medium, high]
                safetyPosture:
                  type: string
                  enum: [standard, strict]
                citationBehavior:
                  type: string
                uncertaintyBehavior:
                  type: string
                guardrails:
                  type: array
                  items:
                    type: string
            channels:
              type: object
              properties:
                dm:
                  type: object
                  properties:
                    qaBehavior:
                      type: object
                      properties:
                        responseLength:
                          type: string
                          enum: [short, medium, long]
                        clarifyWhenAmbiguous:
                          type: boolean
                        addContextWhenUseful:
                          type: boolean
                        answerScope:
                          type: string
                          enum: [helpUserUnderstandTheLecture, broaderSubjectArea, companyContextOnly, open]
                        allowFollowUpDialogue:
                          type: boolean
                    proactivePolicy:
                      type: object
                      properties:
                        initiativeLevel:
                          type: string
                          enum: [passive, lightlyProactive, moderatelyProactive, highlyProactive]
                        minContributionMinutes:
                          type: number
                        socialSensitivity:
                          type: string
                          enum: [low, medium, high]
                    guardrails:
                      type: array
                      items:
                        type: string
                groupChat:
                  type: object
                  properties:
                    proactivePolicy:
                      type: object
                      properties:
                        initiativeLevel:
                          type: string
                          enum: [passive, lightlyProactive, moderatelyProactive, highlyProactive]
                        minContributionMinutes:
                          type: number
                        socialSensitivity:
                          type: string
                          enum: [low, medium, high]
                    pollPolicy:
                      type: object
                      properties:
                        allowed:
                          type: boolean
                    guardrails:
                      type: array
                      items:
                        type: string

    Resource:
      type: object
      required:
        - source
        - category
        - title
        - participantVisible
      properties:
        id:
          type: string
        source:
          type: string
          enum: [speaker, ai]
          description: Whether the resource was added by the conversation creator or by an AI agent.
        category:
          type: string
          enum: [required, referenced, suggested]
          description: >
            required — speaker-assigned background reading;
            referenced — cited during the talk and surfaced by the librarian;
            suggested — proactively recommended by the librarian or speaker.
        title:
          type: string
        authors:
          type: array
          items:
            type: string
        year:
          type: string
        url:
          type: string
        hasPdf:
          type: boolean
          description: True when a PDF file is attached to this resource. The on-disk filename is not exposed.
        citation:
          type: string
          description: Full formatted citation string. Used verbatim in RAG metadata when provided; falls back to title/authors/year otherwise.
        description:
          type: string
          description: Creator-provided relevance note.
        summary:
          type: string
          description: AI-generated content summary; populated asynchronously for required readings.
        relevanceReason:
          type: string
          description: One-line relevance note generated by the librarian agent.
        participantVisible:
          type: boolean
        addedAt:
          type: string
          format: date-time

    ExperimentAgent:
      type: object
      properties:
        agent:
          $ref: '#/components/schemas/Agent'
          description: Reference to an existing agent on the base conversation. Mutually exclusive with agentType.
        agentType:
          type: string
          description: Agent type to instantiate as a new agent. Mutually exclusive with agent.
        experimentValues:
          type: object
          additionalProperties: true
          description: >
            Spread into the cloned or created agent to override defaults
            (e.g. llmTemplates, agentConfig, llmModel).

    Experiment:
      type: object
      required:
        - name
        - baseConversation
        - createdBy
        - createdAt
        - status
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        baseConversation:
          oneOf:
            - type: string
              description: Conversation ObjectId when not populated
            - $ref: '#/components/schemas/Conversation'
        createdBy:
          oneOf:
            - type: string
              description: User ObjectId when not populated
            - $ref: '#/components/schemas/User'
        createdAt:
          type: string
          format: date-time
        status:
          type: string
          enum: [running, completed, failed, 'not started']
        agents:
          type: array
          items:
            $ref: '#/components/schemas/ExperimentAgent'
        resultConversation:
          oneOf:
            - type: string
              description: Conversation ObjectId when not populated
            - $ref: '#/components/schemas/Conversation'
        executedAt:
          type: string
          format: date-time

    Poll:
      type: object
      required:
        - title
        - slug
        - locked
        - owner
        - topic
        - multiSelect
        - allowNewChoices
        - choicesVisible
        - responseCountsVisible
        - onlyOwnChoicesVisible
        - whenResultsVisible
        - responsesVisibleToNonParticipants
        - responsesVisible
      properties:
        id:
          type: string
        title:
          type: string
        slug:
          type: string
        description:
          type: string
        locked:
          type: boolean
        owner:
          oneOf:
            - type: string
              description: User ObjectId when not populated
            - $ref: '#/components/schemas/User'
        threshold:
          type: number
        expirationDate:
          type: string
          format: date-time
        topic:
          oneOf:
            - type: string
              description: Topic ObjectId when not populated
            - $ref: '#/components/schemas/Topic'
        multiSelect:
          type: boolean
        allowNewChoices:
          type: boolean
        choicesVisible:
          type: boolean
        responseCountsVisible:
          type: boolean
        onlyOwnChoicesVisible:
          type: boolean
        whenResultsVisible:
          type: string
        responsesVisibleToNonParticipants:
          type: boolean
        responsesVisible:
          type: boolean
        choices:
          type: array
          items:
            $ref: '#/components/schemas/PollChoice'

    PollChoice:
      type: object
      required:
        - text
        - poll
      properties:
        id:
          type: string
        text:
          type: string
        poll:
          oneOf:
            - type: string
              description: Poll ObjectId when not populated
            - $ref: '#/components/schemas/Poll'

    PollResponse:
      type: object
      required:
        - choice
        - removed
        - owner
        - poll
      properties:
        id:
          type: string
        choice:
          oneOf:
            - type: string
              description: PollChoice ObjectId when not populated
            - $ref: '#/components/schemas/PollChoice'
        removed:
          type: boolean
        owner:
          oneOf:
            - type: string
              description: User ObjectId when not populated
            - $ref: '#/components/schemas/User'
        poll:
          oneOf:
            - type: string
              description: Poll ObjectId when not populated
            - $ref: '#/components/schemas/Poll'

    GenericAgentAnswer:
      type: object
      required:
        - explanation
        - message
        - visible
        - channels
        - action
      properties:
        explanation:
          type: string
        message:
          oneOf:
            - type: string
            - type: object
              additionalProperties: true
        visible:
          type: boolean
        channels:
          type: array
          items:
            type: string
        action:
          type: integer
          enum: [0, 1, 2]

    AgentResponse:
      type: object
      required:
        - visible
        - message
      properties:
        visible:
          type: boolean
        message:
          oneOf:
            - type: string
            - type: object
              additionalProperties: true
        channels:
          type: array
          items:
            $ref: '#/components/schemas/Channel'
        messageType:
          type: string
        context:
          type: string

    LlmPlatformDetails:
      type: object
      required:
        - name
        - description
      properties:
        name:
          type: string
        description:
          type: string
        options:
          $ref: '#/components/schemas/LlmPlatformOptions'

    LlmModelDetails:
      type: object
      required:
        - name
        - label
        - llmPlatform
        - llmModel
        - description
      properties:
        name:
          type: string
        label:
          type: string
        llmPlatform:
          type: string
        llmModel:
          type: string
        description:
          type: string
        defaultModelOptions:
          type: object
          additionalProperties: true

    PaginateResults:
      type: object
      required:
        - results
        - page
        - limit
        - totalPages
        - totalResults
      properties:
        results:
          type: array
          items:
            type: object
        page:
          type: integer
        limit:
          type: integer
        totalPages:
          type: integer
        totalResults:
          type: integer

    Token:
      type: object
      properties:
        token:
          type: string
        expires:
          type: string
          format: date-time
      example:
        token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiI1ZWJhYzUzNDk1NGI1NDEzOTgwNmMxMTIiLCJpYXQiOjE1ODkyOTg0ODQsImV4cCI6MTU4OTMwMDI4NH0.m1U63blB0MLej_WfB7yC2FTMnCziif9X8yzwDEfJXAg
        expires: 2020-05-12T16:18:04.793Z

    AuthTokens:
      type: object
      properties:
        access:
          $ref: '#/components/schemas/Token'
        refresh:
          $ref: '#/components/schemas/Token'

    GraphNodeProvenance:
      type: object
      description: >-
        Where a node in a concept graph came from. Every field is optional: a graph
        assembled from a whole event has no single message to point at, while one built
        live from the transcript can attribute nearly every node.
      properties:
        conversationId:
          type: string
          description: >-
            Carried even though the artifact knows its own container, because a
            topic-scoped graph draws on several conversations.
        messageId:
          type: string
          description: The specific message this node came from
        pseudonym:
          type: string
          description: Display name of whoever contributed it

    GraphConcept:
      type: object
      description: An idea or entity in a concept graph.
      required:
        - id
        - label
      properties:
        id:
          type: string
          description: >-
            Opaque and stable, so renaming a concept is an edit to one node rather than a
            delete plus a create, and two versions of the graph stay diffable.
          example: c-verifiable-credential
        label:
          type: string
          description: What the client draws
          example: Verifiable Credential
        origin:
          type: string
          description: Id of the GraphOriginPrompt this concept came out of
          example: p1
        gloss:
          type: string
          description: One plain sentence saying what this concept means in this discussion.
          example: A registry participants check credentials against.
        foldedFrom:
          type: array
          items:
            type: string
          description: >-
            Labels of concepts folded into this one because the series graph outgrew its size
            cap. Distinct from an ordinary cross-session merge, which leaves no trace here since
            the two labels really named the same idea — a folded concept was a genuinely
            distinct idea, consolidated for space, so its label is kept so a reader can still
            find it.
          example: ['Registry Interop']
        provenance:
          $ref: '#/components/schemas/GraphNodeProvenance'

    GraphContribution:
      type: object
      description: >-
        A relationship between concepts, reified as its own node rather than left as an
        edge. That is what lets one contribution join three or more concepts at once, which
        a plain edge cannot express — and why concepts never reference each other directly.
      required:
        - id
        - kind
        - concepts
      properties:
        id:
          type: string
          example: k15
        kind:
          type: string
          description: "The relationship's name, and the short label a client renders on the node"
          example: co-governs
        statement:
          type: string
          description: >-
            What the conversation said about this relationship, in a sentence — the hover or
            side-panel text behind the short `kind` label. Normally a paraphrase; a verbatim
            quotation appears only inside quotation marks and only when it carries no
            personally identifying information.
          example: >-
            Participants argued a trust registry only means anything if verifiers actually
            check it before accepting a credential.
        concepts:
          type: array
          minItems: 1
          description: Ids of the GraphConcepts this relationship joins
          items:
            type: string
          example: [c-issuer, c-verifier, c-trust-registry]
        origin:
          type: string
          description: Id of the GraphOriginPrompt this contribution came out of
        provenance:
          $ref: '#/components/schemas/GraphNodeProvenance'

    GraphOriginPrompt:
      type: object
      description: >-
        The prompt or question a concept or contribution came out of: the third node kind.
        Attached by a direct `origin` reference rather than through a contribution, since
        an origin is attribution rather than a relationship between concepts.
      required:
        - id
        - text
      properties:
        id:
          type: string
          example: p1
        text:
          type: string
          example: 'What has to be trustworthy for a credential to mean anything?'
        provenance:
          $ref: '#/components/schemas/GraphNodeProvenance'

    ConceptGraphPayload:
      type: object
      description: >-
        The version payload of a ConceptGraphArtifact. Every array defaults to empty, so
        the artifact can be created when an event starts and fill in as it runs. Nothing
        about layout is stored — position, size and colour are all derived by the client
        from the graph itself. Ids are unique across all three arrays, every id in
        `contributions[].concepts` names a concept in this payload, and every `origin`
        names an origin prompt in it.
      properties:
        concepts:
          type: array
          items:
            $ref: '#/components/schemas/GraphConcept'
        contributions:
          type: array
          items:
            $ref: '#/components/schemas/GraphContribution'
        originPrompts:
          type: array
          items:
            $ref: '#/components/schemas/GraphOriginPrompt'

    ArtifactVersion:
      type: object
      description: >-
        One immutable revision of an artifact. Versions are append-only: an edit writes a
        new one rather than changing an existing one, so the full history stays readable.
      required:
        - artifact
        - versionNumber
        - payload
      properties:
        id:
          type: string
        artifact:
          type: string
          description: Artifact ObjectId
        versionNumber:
          type: number
          description: >-
            1-based and strictly increasing per artifact. Not guaranteed contiguous: an
            append that claims a number and then fails to write leaves it unused.
          example: 3
        payload:
          oneOf:
            - $ref: '#/components/schemas/ConceptGraphPayload'
            - type: object
              additionalProperties: true
          description: >-
            Kind-specific content, whose shape is determined by the artifact's `type`. A
            DocumentArtifact payload is `{ body: string }`; a ConceptGraphArtifact payload
            is a ConceptGraphPayload.
          example:
            body: 'The group converged on three priorities...'
        createdBy:
          type: string
          description: BaseUser ObjectId — the organizer or agent that wrote this version
        note:
          type: string
          description: Free-text note on what changed, for a history view
          example: 'Revised after the second breakout'
        createdAt:
          type: string
          format: date-time

    Artifact:
      type: object
      description: >-
        A shared data object that emerges from one or more conversations — a document, a
        link to an external resource, or a custom data model a client renders its own way.
        Scoped either to a single conversation or to a whole topic. The artifact's content
        is the payload of its `currentVersion`; every earlier version is retained and
        readable through the versions endpoints.
      required:
        - scope
        - topic
        - title
      properties:
        id:
          type: string
        type:
          type: string
          description: >-
            Which kind of artifact this is, and therefore which renderer a client should
            use and what shape its version payload has. Serialized from the mongoose
            discriminator key.
          enum: [DocumentArtifact, ConceptGraphArtifact]
          example: DocumentArtifact
        scope:
          type: string
          enum: [topic, conversation]
          description: Which container this artifact belongs to
        topic:
          oneOf:
            - type: string
              description: Topic ObjectId when not populated
            - $ref: '#/components/schemas/Topic'
          description: >-
            Always set. For a conversation-scoped artifact this is the conversation's own
            topic, so a topic listing can include the artifacts of its conversations for
            the topic owner and administrators.
        conversation:
          oneOf:
            - type: string
              description: Conversation ObjectId when not populated
            - $ref: '#/components/schemas/Conversation'
          description: Set only when scope is `conversation`
        title:
          type: string
          example: 'Shared priorities'
        description:
          type: string
        currentVersion:
          oneOf:
            - type: string
              description: ArtifactVersion ObjectId when not populated
            - $ref: '#/components/schemas/ArtifactVersion'
          description: The newest version — populated by the fetch and list endpoints
        currentVersionNumber:
          type: number
          description: The newest version's number
          example: 3
        createdBy:
          type: string
          description: BaseUser ObjectId
        locked:
          type: boolean
          description: When true no further versions may be appended; the artifact stays readable
        createdAt:
          type: string
          format: date-time

    Error:
      type: object
      properties:
        code:
          type: number
        message:
          type: string

  responses:
    DuplicateEmail:
      description: Email already taken
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: 400
            message: Email already taken
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: 401
            message: Please log in
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: 403
            message: Forbidden
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: 404
            message: Not found

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
